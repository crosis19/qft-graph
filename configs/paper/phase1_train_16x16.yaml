# Phase 1 paper training run — source of record for the hyperparameter appendix.
# This is the protocol that actually produced Table I (16x16 row), Table II, and
# Table III of the paper (notebooks/03_train_colab.ipynb + 05_baselines_colab.ipynb,
# run "colab_run", March 2026). Note: the run predates displacement edges, so
# a_in_edges: false; the mc block matches the embedded config in
# data/mc_configs/phi4_16x16_m2=-0.5_lam=0.5/mc_data.pt.
device: auto
experiment_name: paper_phase1_16x16

lattice:
  dimensions: [16, 16]
  spacing: 1.0
  boundary: periodic

scalar_field:
  mass_squared: -0.5
  coupling: 0.5
  initialization: hot

mc:
  n_configs: 5000
  n_thermalization: 1000
  n_sweeps_between: 10
  step_size: 1.0
  seed: 42

model:
  hidden_dim: 64
  n_mp_blocks: 3
  encoder_layers: 2
  dropout: 0.0
  activation: gelu
  readout: energy
  a_in_edges: false
  volume_scaling: true

training:
  epochs: 150
  batch_size: 32
  lr: 0.001
  weight_decay: 0.00001
  scheduler: cosine
  loss: energy_matching
  checkpoint_every: 20
  seed: 42
