# FSS sweep protocol — source of record for paper Fig. 2 and Secs. IV.D-E.
# This documents the run in notebooks/03_train_colab.ipynb (cell "Focused scan
# around the critical region") that produced
# experiments/runs/colab_run/sweep_results.json.
# NOT an ExperimentConfig; consumed by the sweep tooling (P1-2 rework).
#
# KNOWN ISSUES with the original run (to be fixed in the P1-2 rerun):
#   - seed was None (unseeded) — violates reproducibility ground rule
#   - chi used the frozen convention V*(<M^2> - <|M|>^2), but the xi estimator
#     internally used V*Var(M) (see mc/observables.py::correlation_length_fft)
#   - no jackknife errors on |M| or chi; xi errors from 20-block jackknife
coupling: 0.5
m2_min: -1.5
m2_max: -2.8
m2_steps: 25
n_configs_per_point: 2000
n_thermalization: 1500
sizes: [16, 32, 64]
sweeps_between:
  16: 10
  32: 20
  64: 40
warm_start: true # final config of previous m2 point seeds the next
seed: null
