# Phase 1 paper training run at 64x64 (Table I, second row).
# Same protocol as phase1_train_16x16.yaml; the mc block matches the embedded
# config in data/mc_configs/phi4_64x64_m2=-0.5_lam=0.5/mc_data.pt (the training
# data used n_sweeps_between=10 at ALL sizes; the 40-sweep separation applies
# only to the FSS sweep, see phase1_fss_sweep.yaml).
device: auto
experiment_name: paper_phase1_64x64

lattice:
  dimensions: [64, 64]
  spacing: 1.0
  boundary: periodic

scalar_field:
  mass_squared: -0.5
  coupling: 0.5
  initialization: hot

mc:
  n_configs: 5000
  n_thermalization: 1000
  n_sweeps_between: 10
  step_size: 1.0
  seed: 42

model:
  hidden_dim: 64
  n_mp_blocks: 3
  encoder_layers: 2
  dropout: 0.0
  activation: gelu
  readout: energy
  a_in_edges: false
  volume_scaling: true

training:
  epochs: 150
  batch_size: 32
  lr: 0.001
  weight_decay: 0.00001
  scheduler: cosine
  loss: energy_matching
  checkpoint_every: 20
  seed: 42
